<!DOCTYPE html>

<html>

<head>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Signin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            margin: 0;
            background: #f4f4f4;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 400px;
            margin: 50px auto;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 20px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background: #555;
        }

        .error {
            text-align: center;
            color: red;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #222;
            text-decoration: none;
        }

        @media (max-width: 600px) {

            header h1 {
                font-size: 22px;
            }

            .container {
                width: 92%;
                margin: 30px auto;
            }

            .form-box {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>
        Course Registration System
    </h1>

</header>


<div class="container">

    <div class="form-box">

        <h2>
            Signin
        </h2>


        {% if error %}

            <p class="error">
                {{ error }}
            </p>

        {% endif %}


        <form
            method="POST"
            action="/signin/"
        >

            {% csrf_token %}


            <label>
                Username
            </label>

            <input
                type="text"
                name="username"
                placeholder="Enter username"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter password"
                required
            >


            <button type="submit">
                Signin
            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="/login/">
                Login
            </a>

        </div>

    </div>

</div>


</body>

</html>
