
<!DOCTYPE html>
<html>

<head>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>


    <style>

        body {
            font-family: Arial;
            margin: 0;
            background: #f4f4f4;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }


        header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 400px;
            margin: 50px auto;
        }

        .form-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #ccc;
        }


        .form-box h2 {
            text-align: center;
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }


        button:hover {
            background: #555;
        }

        #message {
            margin-top: 15px;
            text-align: center;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
        }


        .signup-link a {
            color: #222;
            text-decoration: none;
        }


        .signup-link a:hover {
            text-decoration: underline;
        }


    </style>

</head>


<body>


    <header>

        <h1>
            Course Registration System
        </h1>

    </header>

    <div class="container">

        <div class="form-box">

            <h2>
                Login
            </h2>


            <form id="loginForm">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

               <a href="index.html">
                <button type="button">Login</button>
            </a>


            </form>

            <p id="message"></p>

            <div class="signup-link">

                Don't have an account?

                <a href="siginup.html">
                    Signup
                </a>

            </div>

        </div>

    </div>



    <script>

        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {


                event.preventDefault();

                const username =
                    document.getElementById("username").value;


                const password =
                    document.getElementById("password").value;

                fetch(
                    "http://127.0.0.1:8000/api/login-page/",
                    {
                        method: "POST",

                        credentials: "include",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            username: username,

                            password: password

                        })

                    }
                )


                .then(response => response.json())


                .then(data => {


                    const message =
                        document.getElementById("message");


                    if (data.Message) {

                        message.innerHTML =
                            data.Message;

                        setTimeout(function() {

                            window.location.href =
                                "index.html";

                        }, 1000);

                    }


                    else if (data.error) {

                        message.innerHTML =
                            data.error;

                    }

                })


                .catch(error => {

                    console.log(error);

                    document.getElementById("message").innerHTML =
                        "Something went wrong.";

                });


            });


    </script>


</body>

</html>
