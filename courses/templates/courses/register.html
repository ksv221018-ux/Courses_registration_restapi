<!DOCTYPE html>

<html>

<head>


<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Course Registration</title>

<style>

    body {
        font-family: Arial;
        margin: 0;
        background: #f4f4f4;
    }

    header {
        background: #222;
        color: white;
        padding: 20px;
        text-align: center;
    }

    header h1 {
        margin: 0;
    }

    .container {
        width: 90%;
        max-width: 500px;
        margin: 40px auto;
    }

    .form-box {
        background: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px #ccc;
    }

    .form-box h2 {
        margin-top: 0;
        text-align: center;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
    }

    input,
    select {
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    input:focus,
    select:focus {
        outline: none;
        border-color: #222;
    }

    button {
        width: 100%;
        margin-top: 25px;
        padding: 12px;
        background: #222;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }

    button:hover {
        background: #555;
    }

    #message {
        text-align: center;
        margin-top: 15px;
    }

    @media (max-width: 600px) {

        .container {
            width: 90%;
            margin: 25px auto;
        }

        .form-box {
            padding: 20px;
        }

    }

</style>


</head>

<body>


<header>

    <h1>
        Course Registration System
    </h1>

</header>


<div class="container">

    <div class="form-box">

        <h2>
            Course Registration
        </h2>


        <form id="registerForm">

    <label>
        Name
    </label>

    <input
        type="text"
        id="name"
        required
    >


    <label>
        Email
    </label>

    <input
        type="email"
        id="email"
        required
    >


    <label>
        Phone
    </label>

    <input
        type="text"
        id="phone"
        required
    >


    <label>
        Age
    </label>

    <input
        type="number"
        id="age"
        required
    >


    <label>
        Address
    </label>

    <input
        type="text"
        id="address"
        required
    >


    <label>
        Qualification
    </label>

    <input
        type="text"
        id="qualification"
        required
    >


    <label>
        Course Name
    </label>

    <input
        type="text"
        id="courseName"
        readonly
    >


    <label>
        Availability
    </label>

    <select
        id="availability"
        required
    >

        <option value="">
            Select Availability
        </option>

        <option value="Yes">
            Yes
        </option>

        <option value="No">
            No
        </option>

    </select>


    <button type="submit">
        Apply
    </button>

    <p id="message"></p>

</form>
    </div>

</div>


<script>

   const urlParams =
    new URLSearchParams(window.location.search);

const courseId =
    urlParams.get("id");


fetch(
    "http://127.0.0.1:8000/api/home/"
)

.then(response => response.json())

.then(data => {

    const course =
        data.find(
            course => course.id == courseId
        );

    if (course) {

        document.getElementById("courseName").value =
            course.course_name;

    }

})

.catch(error => {

    console.log(error);

});



document
    .getElementById("registerForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();


        const name =
    document.getElementById("name").value;

const email =
    document.getElementById("email").value;

const phone =
    document.getElementById("phone").value;

const age =
    document.getElementById("age").value;

const address =
    document.getElementById("address").value;

const qualification =
    document.getElementById("qualification").value;

const availability =
    document.getElementById("availability").value;

        fetch(
            "http://127.0.0.1:8000/api/csrf/",
            {
                method: "GET",
                credentials: "include"
            }
        )

        .then(() => {

            const csrfToken =
                getCookie("csrftoken");

            return fetch(
                "http://127.0.0.1:8000/api/apply/"
                + courseId
                + "/",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "X-CSRFToken":
                            csrfToken

                    },

                    credentials: "include",

                   body: JSON.stringify({

    name: name,

    email: email,

    phone: phone,

    age: age,

    address: address,

    qualification: qualification,

    course: courseId

})

                }
            );

        })

        .then(response => {

            return response.json();

        })

        .then(data => {

            console.log(data);


            if (data.Message) {

                window.location.href =
                    "success.html";

            }

            else {

                document.getElementById("message")
                    .innerText =
                    JSON.stringify(data);

            }

        })

        .catch(error => {

            console.log(error);

            document.getElementById("message")
                .innerText =
                "Unable to connect to server";

        });

    });

function getCookie(name) {

    let cookieValue = null;

    if (document.cookie &&
        document.cookie !== "") {

        const cookies =
            document.cookie.split(";");

        for (
            let cookie of cookies
        ) {

            cookie = cookie.trim();

            if (
                cookie.substring(
                    0,
                    name.length + 1
                ) === name + "="
            ) {

                cookieValue =
                    decodeURIComponent(
                        cookie.substring(
                            name.length + 1
                        )
                    );

                break;

            }

        }

    }

    return cookieValue;
}
</script>


</body>

</html>
